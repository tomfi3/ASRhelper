<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASR Helper - Air Quality Data</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; color: #333; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.3rem; margin-bottom: 0.5rem; }
        p.intro { font-size: 0.85rem; color: #555; margin-bottom: 1.5rem; }
        .row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .col { flex: 1; min-width: 280px; }
        .field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.75rem; }
        .field label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: #555; }
        .field input, .field select { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; }
        .field input { width: 160px; }
        textarea { width: 100%; height: 320px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.8rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { padding: 0.5rem 1.5rem; background: #2b6cb0; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.95rem; }
        button:disabled { background: #a0aec0; cursor: not-allowed; }
        #status { margin-bottom: 1rem; font-size: 0.9rem; min-height: 1.5em; }
        .err { color: #c53030; } .ok { color: #276749; } .load { color: #2b6cb0; }
        table { border-collapse: collapse; font-size: 0.85rem; margin-bottom: 1rem; width: 100%; }
        th { background: #2b6cb0; color: #fff; padding: 0.5rem 0.75rem; text-align: center; white-space: nowrap; }
        td { padding: 0.5rem 0.75rem; border: 1px solid #ddd; text-align: center; }
        tr:nth-child(even) { background: #f7fafc; }
        td.lbl { text-align: left; font-weight: 500; background: #edf2f7; }
        tr.summary { font-weight: 600; background: #ebf8ff !important; }
        .low-dc { color: #c53030; }
        .section { margin-top: 1.5rem; }
        .section h2 { font-size: 1rem; margin-bottom: 0.5rem; }
        .note { font-size: 0.8rem; color: #666; margin-top: 0.5rem; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #bee3f8; border-top-color: #2b6cb0; border-radius: 50%; animation: spin .5s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .example { font-size: 0.75rem; color: #888; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <h1>ASR Helper</h1>
    <p class="intro">Paste your diffusion tube changeover dates below. The app fetches NO2 automatic analyser data for each exposure period from the London Air API.</p>

    <div class="row">
        <div class="col">
            <div class="field">
                <label>Site Code</label>
                <input id="site" value="RI1" placeholder="e.g. RI1">
            </div>
            <div class="field">
                <label>Year</label>
                <input id="year" type="number" value="2024" min="2000" max="2030">
            </div>
            <div class="field">
                <label>Changeover Dates (paste from Excel)</label>
                <textarea id="dates" placeholder="Paste dates here - one per line, or tab/comma separated from a spreadsheet.

Each date is when tubes were swapped. The app calculates exposure periods between consecutive dates.

Example:
05/01/2024
02/02/2024
01/03/2024
05/04/2024
03/05/2024
07/06/2024
05/07/2024
02/08/2024
06/09/2024
04/10/2024
01/11/2024
06/12/2024
03/01/2025"></textarea>
                <p class="example">Expects 13 dates for 12 months (start of Jan exposure through to start of Jan next year). Accepts DD/MM/YYYY, YYYY-MM-DD, or DD-MM-YYYY.</p>
            </div>
            <button id="btn" onclick="run()">Fetch NO2 Data</button>
        </div>
    </div>

    <div id="status"></div>
    <div id="results"></div>

<script>
const API = "https://api.erg.ic.ac.uk/AirQuality";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function parseDate(s) {
    s = s.trim();
    if (!s) return null;
    // YYYY-MM-DD
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return new Date(+m[1], +m[2]-1, +m[3]);
    // DD/MM/YYYY or DD-MM-YYYY
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return new Date(+m[3], +m[2]-1, +m[1]);
    // Try native parse as fallback
    const d = new Date(s);
    return isNaN(d) ? null : d;
}

function parseDatesInput(text) {
    // Split on newlines, tabs, commas - handle pasted spreadsheet data
    const tokens = text.split(/[\n\r\t,]+/).map(s => s.trim()).filter(Boolean);
    const dates = [];
    for (const t of tokens) {
        const d = parseDate(t);
        if (d) dates.push(d);
    }
    return dates.sort((a, b) => a - b);
}

function fmtDate(d) {
    return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function fmtDateAPI(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function fetchHourly(site, species, startDate, endDate) {
    const start = fmtDateAPI(startDate);
    const end = fmtDateAPI(endDate);
    const url = `${API}/Data/SiteSpecies/SiteCode=${site}/SpeciesCode=${species}/StartDate=${start}/EndDate=${end}/Json`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const raw = d.RawAQData || d.AirQualityData || {};
    let entries = raw.Data || [];
    if (!Array.isArray(entries)) entries = [entries];
    const out = [];
    for (const e of entries) {
        const ds = e["@MeasurementDateGMT"] || e["@DateTime"] || e["@Date"] || "";
        const vs = e["@Value"] || e["@Concentration"] || "";
        if (vs && vs.trim()) {
            const v = parseFloat(vs);
            if (!isNaN(v)) out.push({ dt: new Date(ds), value: v });
        }
    }
    return out;
}

async function run() {
    const site = document.getElementById("site").value.trim().toUpperCase();
    const year = parseInt(document.getElementById("year").value);
    const datesText = document.getElementById("dates").value;

    if (!site) { setStatus("Enter a site code", "err"); return; }

    const dates = parseDatesInput(datesText);
    if (dates.length < 2) {
        setStatus("Need at least 2 changeover dates to define exposure periods", "err");
        return;
    }

    const btn = document.getElementById("btn");
    btn.disabled = true;
    document.getElementById("results").innerHTML = "";

    // Build exposure periods from consecutive dates
    const periods = [];
    for (let i = 0; i < dates.length - 1; i++) {
        periods.push({ start: dates[i], end: dates[i + 1], monthIdx: i });
    }

    let html = `<div class="section"><h2>NO2 Data - ${site} (${year})</h2>`;
    html += `<table><tr>
        <th>Month</th>
        <th>Exposure Start</th>
        <th>Exposure End</th>
        <th>Days</th>
        <th>Valid Hours</th>
        <th>Expected Hours</th>
        <th>Data Capture (%)</th>
        <th>Period Mean NO2<br>(\u00b5g/m\u00b3)</th>
    </tr>`;

    let totalValues = 0, totalSum = 0, totalExpected = 0, totalValid = 0;

    for (let i = 0; i < periods.length; i++) {
        const p = periods[i];
        const days = Math.round((p.end - p.start) / 86400000);
        const expected = days * 24;
        const label = i < 12 ? MONTHS[i] : `Period ${i + 1}`;

        setStatus(`<span class="spinner"></span>Fetching ${label} (${fmtDate(p.start)} \u2013 ${fmtDate(p.end)})...`, "load");

        try {
            // Fetch from start date to day before end date (end date is next tube's start)
            const fetchEnd = new Date(p.end);
            fetchEnd.setDate(fetchEnd.getDate() - 1);
            const records = await fetchHourly(site, "NO2", p.start, fetchEnd);

            const count = records.length;
            const dc = expected > 0 ? +((count / expected) * 100).toFixed(1) : 0;
            const mean = count > 0 ? +(records.reduce((s, r) => s + r.value, 0) / count).toFixed(1) : null;
            const dcCls = dc < 75 ? ' class="low-dc"' : '';

            totalExpected += expected;
            totalValid += count;
            if (mean != null) { totalValues++; totalSum += mean; }

            html += `<tr>
                <td class="lbl">${label}</td>
                <td>${fmtDate(p.start)}</td>
                <td>${fmtDate(p.end)}</td>
                <td>${days}</td>
                <td>${count}</td>
                <td>${expected}</td>
                <td${dcCls}>${dc}</td>
                <td>${mean != null ? mean : "\u2014"}</td>
            </tr>`;
        } catch (e) {
            console.warn(`Period ${i} failed:`, e);
            html += `<tr>
                <td class="lbl">${label}</td>
                <td>${fmtDate(p.start)}</td>
                <td>${fmtDate(p.end)}</td>
                <td>${days}</td>
                <td colspan="4" class="low-dc">Error fetching data</td>
            </tr>`;
        }
    }

    // Summary
    const overallDC = totalExpected > 0 ? +((totalValid / totalExpected) * 100).toFixed(1) : 0;
    const annualMean = totalValues > 0 ? (totalSum / totalValues).toFixed(1) : "\u2014";
    html += `<tr class="summary">
        <td class="lbl" colspan="4">Annual Summary (${totalValues} periods)</td>
        <td>${totalValid}</td>
        <td>${totalExpected}</td>
        <td>${overallDC}</td>
        <td>${annualMean}</td>
    </tr></table>`;

    html += `<p class="note">Periods with &lt;75% data capture shown in red. Each period runs from changeover date to the day before next changeover. Data from London Air Quality Network.</p>`;
    html += `</div>`;

    document.getElementById("results").innerHTML = html;
    setStatus(`Done - ${site} (${periods.length} periods fetched)`, "ok");
    btn.disabled = false;
}

function setStatus(msg, cls) {
    document.getElementById("status").innerHTML = msg;
    document.getElementById("status").className = cls;
}
</script>
</body>
</html>
